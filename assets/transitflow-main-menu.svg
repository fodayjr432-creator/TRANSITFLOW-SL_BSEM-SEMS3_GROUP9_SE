    <text x="38" y="273" fill="#facc15">3.</text>
    <text x="70" y="273" fill="#e5e7eb">View Registered Riders Directory (Table View)</text>
    <text x="38" y="309" fill="#facc15">4.</text>
    <text x="70" y="309" fill="#e5e7eb">View Union Analytics &amp; Revenue Summary</text>
    <text x="38" y="345" fill="#facc15">5.</text>
    <text x="70" y="345" fill="#e5e7eb">Exit Application</text>
    <text x="38" y="397" fill="#60a5fa">Select an option (1-5):</text>
    <rect x="280" y="378" width="10" height="25" fill="#60a5fa"/>
